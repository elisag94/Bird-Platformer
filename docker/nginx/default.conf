# SOURCE OF TRUTH. k8s/configmap.yaml is generated from this file by hand
# until Week 3 Day 6 replaces it with Helm's .Files.Get. Edit here first.

server {
    listen 80;

    # Where the files live inside the container — this is where the
    # Dockerfile copies web/game/ to.
    root /usr/share/nginx/html;
    index index.html;

    # Kubernetes will ask for this over and over to check the container is
    # healthy. Answering directly means a probe never has to load a real page.
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Browsers should never keep a copy of this page
    location = /index.html {
    add_header Cache-Control "no-cache";
    }

    # Safe ONLY while Unity's "Name Files As Hashes" is enabled
    # (Player Settings → Web → Publishing Settings; stored in
    # ProjectSettings.asset as webGLNameFilesAsHashes: 1).
    #
    location /Build/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # "Name Files As Hashes" only hashes the /Build/ output. TemplateData
    # keeps stable names — style.css, favicon.ico, the logo images — so the
    # same filename really can change contents between builds.
    location /TemplateData/ {
        add_header Cache-Control "public, max-age=300";
    }

    # Unity gzip-compressed output. Two headers, two different jobs:
    #   Content-Encoding: how the bytes are wrapped (unwrap me)
    #   Content-Type:     what they are once unwrapped
    # Without both, the browser downloads a .gz file instead of running it.
    #
    # NOTE: these are regex locations (~), which take priority over the
    # prefix location /Build/ above — so Cache-Control must be repeated
    # here. nginx does not merge add_header across blocks; the innermost
    # block that has ANY add_header wins and the parent's are dropped.
    location ~ \.wasm\.gz$ {
        add_header Content-Encoding gzip;
        add_header Cache-Control "public, max-age=31536000, immutable";
        default_type application/wasm;
    }

    location ~ \.js\.gz$ {
        add_header Content-Encoding gzip;
        add_header Cache-Control "public, max-age=31536000, immutable";
        default_type application/javascript;
    }

    location ~ \.data\.gz$ {
        add_header Content-Encoding gzip;
        add_header Cache-Control "public, max-age=31536000, immutable";
        default_type application/octet-stream;
    }
}
