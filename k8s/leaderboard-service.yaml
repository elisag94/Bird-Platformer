# The room number the Ingress will forward /api requests to.
#
# Note the port translation: this Service listens on 80 and forwards to the
# container's 8080. The Ingress rule can then say "port: 80" like it does for
# the game, and the fact that Flask happens to run on 8080 stays an internal
# detail. A Service is a stable front for pods whose real ports may vary.
apiVersion: v1
kind: Service
metadata:
  name: leaderboard-service
spec:
  type: ClusterIP
  selector:
    app: leaderboard
  ports:
    - protocol: TCP
      port: 80
      targetPort: 8080
