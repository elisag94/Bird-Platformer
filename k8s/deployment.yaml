apiVersion: apps/v1
kind: Deployment
metadata:
  name: bird-platformer-game
  labels:
    app: bird-platformer
spec:
  replicas: 3
  selector:
    matchLabels:
      app: bird-platformer
  template:
    metadata:
      labels:
        app: bird-platformer
    spec:
      automountServiceAccountToken: false
      containers:
      - name: bird-platformer-container
        image: bird-platformer:v4
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 80
        resources:
          requests: { memory: "32Mi", cpu: "50m" }
          limits:   { memory: "128Mi", cpu: "200m" }
        volumeMounts:
        - name: nginx-config
          mountPath: /etc/nginx/conf.d
          readOnly: true
        readinessProbe:
          httpGet: { path: /healthz, port: 80 }
          initialDelaySeconds: 2
          periodSeconds: 5
          timeoutSeconds: 3
        livenessProbe:
          httpGet: { path: /healthz, port: 80 }
          initialDelaySeconds: 10
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3

      # Volumes belong to the POD, mounts belong to the CONTAINER.
      volumes:
      - name: nginx-config
        configMap:
          name: bird-platformer-config