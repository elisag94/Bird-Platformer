apiVersion: apps/v1
kind: Deployment
metadata:
  name: bird-platformer-game
  labels:
    app: bird-platformer
spec:
  replicas: 3
  selector:
    matchLabels:
      app: bird-platformer
  template:
    metadata:
      labels:
        app: bird-platformer
    spec:
      automountServiceAccountToken: false
      containers:
      - name: bird-platformer-container
        image: bird-platformer:v1
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 80
        volumeMounts:
        - name: nginx-config
          mountPath: /etc/nginx/conf.d
          readOnly: true

      # Volumes belong to the POD, mounts belong to the CONTAINER.
      volumes:
      - name: nginx-config
        configMap:
          name: bird-platformer-config