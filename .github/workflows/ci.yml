name: Unity CI

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  tests:
    name: Run Unity tests (EditMode + PlayMode)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Free up disk space on runner
        run: |
          echo "Pruning docker system, builder cache and runner temps to free space"
          sudo docker system prune -af || true
          sudo docker builder prune -af || true
          sudo docker image prune -a -f || true
          sudo docker volume prune -f || true
          # remove runner temp/cache directories (safe on ephemeral runners)
          sudo rm -rf /home/runner/work/_temp/* || true
          sudo rm -rf /home/runner/.cache/* || true
          sudo rm -rf /tmp/* || true
          # show free space for debugging
          df -h || true
          sudo docker info || true

      - name: Run Unity Test Runner
        uses: game-ci/unity-test-runner@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          projectPath: .
          unityVersion: 6000.5.6f1
          testMode: all
          artifactsPath: test-results

      - name: Upload test results
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: test-results

  build:
    name: Build (smoke build)
    runs-on: ubuntu-latest
    needs: tests

    steps:
      - uses: actions/checkout@v4

      - name: Remove Library to prevent cross-version cache problems
        run: rm -rf Library || true

      - name: Free up disk space on runner
        run: |
          echo "Pruning docker system, builder cache and runner temps to free space"
          sudo docker system prune -af || true
          sudo docker builder prune -af || true
          sudo docker image prune -a -f || true
          sudo docker volume prune -f || true
          # remove runner temp/cache directories (safe on ephemeral runners)
          sudo rm -rf /home/runner/work/_temp/* || true
          sudo rm -rf /home/runner/.cache/* || true
          sudo rm -rf /tmp/* || true
          # show free space for debugging
          df -h || true
          sudo docker info || true

      - name: Build with Unity
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          projectPath: .
          unityVersion: 6000.5.6f1
          targetPlatform: StandaloneLinux64

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: build-StandaloneLinux64
          path: build