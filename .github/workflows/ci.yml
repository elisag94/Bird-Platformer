name: Unity CI

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:
    inputs:
      force_build:
        description: "Rebuild both images even if their inputs didn't change"
        type: boolean
        default: false

env:
  SHA: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  changes:
    name: What changed?
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      packages: read           # to check GHCR for existing tags
    outputs:
      game: ${{ steps.filter.outputs.game == 'true' || inputs.force_build || steps.src.outputs.game_src == '' }}
      leaderboard: ${{ steps.filter.outputs.leaderboard == 'true' || inputs.force_build || steps.src.outputs.lb_src == '' }}
      game_src: ${{ steps.src.outputs.game_src }}
      lb_src: ${{ steps.src.outputs.lb_src }}
      game_seed: ${{ steps.src.outputs.game_seed }}
      lb_seed: ${{ steps.src.outputs.lb_seed }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0         # full history, so git log can look back

      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            game:
              - 'Assets/**'
              - 'Packages/**'
              - 'ProjectSettings/**'
              - 'docker/**'
              - '.dockerignore'
              - 'helm/bird-platformer/files/**'
            leaderboard:
              - 'api/**'

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Which commit last changed each image's inputs, and is its image in GHCR?
      #   found     -> <name>_src=<commit>   re-label it
      #   not found -> <name>_src=           must build
      # When we must build only because that commit was never built (inputs
      # unchanged), <name>_seed=<commit>: the build also gets that commit's tag,
      # so the next run finds it instead of falling back forever.
      - name: Find last build of each image
        id: src
        env:
          GAME_CHANGED: ${{ steps.filter.outputs.game }}
          LB_CHANGED: ${{ steps.filter.outputs.leaderboard }}
        run: |
          set -euo pipefail
          decide() {   # $1=output prefix  $2=image  $3=changed?  $4=commit
            if docker manifest inspect "ghcr.io/elisag94/$2:$4" > /dev/null 2>&1; then
              echo "$1_src=$4"  >> "$GITHUB_OUTPUT"
              echo "$1_seed="   >> "$GITHUB_OUTPUT"
            elif [ "$3" != "true" ]; then
              echo "$1_src="    >> "$GITHUB_OUTPUT"
              echo "$1_seed=$4" >> "$GITHUB_OUTPUT"
            else
              echo "$1_src="    >> "$GITHUB_OUTPUT"
              echo "$1_seed="   >> "$GITHUB_OUTPUT"
            fi
          }
          GAME=$(git log -1 --first-parent --format=%H -- \
            Assets Packages ProjectSettings docker .dockerignore helm/bird-platformer/files)
          LB=$(git log -1 --first-parent --format=%H -- api)
          decide game bird-platformer  "$GAME_CHANGED" "$GAME"
          decide lb   bird-leaderboard "$LB_CHANGED"   "$LB"

      - run: |
          echo "game=${{ steps.filter.outputs.game }} src=${{ steps.src.outputs.game_src }} seed=${{ steps.src.outputs.game_seed }}"
          echo "leaderboard=${{ steps.filter.outputs.leaderboard }} src=${{ steps.src.outputs.lb_src }} seed=${{ steps.src.outputs.lb_seed }}"

  tests:
    name: Run Unity tests (EditMode + PlayMode)
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.game == 'true'
    # game-ci/unity-test-runner@v4 changed on 29 Aug 2026 (#310): githubToken now
    # defaults to the workflow token, so the action posts a "Test Results" check
    # run.
    permissions:
      contents: read
      checks: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Free up disk space on runner
        uses: ./.github/actions/free-disk-space

      - name: Run Unity Test Runner
        uses: game-ci/unity-test-runner@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          projectPath: .
          unityVersion: 6000.5.6f1
          testMode: all
          artifactsPath: test-results

      # Renders the NUnit XML onto the workflow run page. No third-party action
      # and no extra permissions — $GITHUB_STEP_SUMMARY is just a file that
      # GitHub renders as markdown.
      # if: always() matters — without it this is skipped exactly when tests
      # fail, which is when you want to read it.
      - name: Summarise test results
        if: always()
        run: |
          python3 - <<'PY'
          import glob, os, sys, xml.etree.ElementTree as ET

          ICON = {"Passed": "✅", "Failed": "❌", "Skipped": "⏭️", "Inconclusive": "❔"}
          files = sorted(glob.glob("test-results/*.xml"))
          out = ["## Unity test results", ""]

          if not files:
              out += ["No result files found under `test-results/`.",
                      "The Unity step probably failed before it could run any tests."]
          else:
              grand = {"passed": 0, "failed": 0, "skipped": 0, "total": 0}
              blocks, failures = [], []

              for path in files:
                  mode = os.path.basename(path).replace("-results.xml", "").replace(".xml", "")
                  try:
                      run = ET.parse(path).getroot()
                  except ET.ParseError as e:
                      out.append(f"Could not parse `{path}`: {e}")
                      continue

                  for k in grand:
                      grand[k] += int(run.get(k, 0) or 0)

                  rows = ["<details>",
                          f"<summary>{mode} — {run.get('passed','0')} passed, "
                          f"{run.get('failed','0')} failed, {run.get('skipped','0')} skipped</summary>",
                          "", "| Test | Result | Time |", "|---|---|---|"]
                  for case in run.iter("test-case"):
                      res = case.get("result", "?")
                      secs = float(case.get("duration", 0) or 0)
                      rows.append(f"| `{case.get('name')}` | {ICON.get(res,'')} {res} | {secs*1000:.0f} ms |")
                      if res == "Failed":
                          msg = case.findtext("failure/message") or ""
                          failures.append((case.get("fullname", case.get("name")), msg.strip()))
                  rows += ["", "</details>", ""]
                  blocks += rows

              verdict = "❌ Failing" if grand["failed"] else "✅ All passing"
              out += [f"**{verdict}** — {grand['passed']} passed, {grand['failed']} failed, "
                      f"{grand['skipped']} skipped, {grand['total']} total", ""]

              if failures:
                  out += ["### Failures", ""]
                  for name, msg in failures:
                      out += [f"**`{name}`**", "", "```", msg, "```", ""]

              out += blocks

          summary = os.environ.get("GITHUB_STEP_SUMMARY")
          text = "\n".join(out) + "\n"
          if summary:
              with open(summary, "a") as fh:
                  fh.write(text)
          else:
              sys.stdout.write(text)
          PY

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: test-results

  build-web:
    name: Build Unity Web (WebGL)
    runs-on: ubuntu-latest
    needs: tests

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Free up disk space on runner
        uses: ./.github/actions/free-disk-space

      # Without this, every run recompiles every asset from scratch. The key
      # changes whenever project content changes, so it invalidates correctly.
      - name: Cache Unity Library
        uses: actions/cache@v4
        with:
          path: Library
          key: Library-WebGL-${{ hashFiles('Assets/**', 'Packages/**', 'ProjectSettings/**') }}
          restore-keys: |
            Library-WebGL-

      # NOTE: the platform is called "Web" in the Unity 6 UI, but the
      # underlying BuildTarget enum is still WebGL, which is what GameCI wants.
      - name: Build with Unity
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          projectPath: .
          unityVersion: 6000.5.6f1
          targetPlatform: WebGL
          buildsPath: build
          buildName: app

      # GameCI's output nesting has changed between versions, so rather than
      # hardcoding a path, find index.html and work back from it.
      - name: Normalise build output to web/game/
        run: |
          set -euo pipefail
          echo "--- what Unity produced ---"
          find build -maxdepth 4 -type d | sort
          INDEX=$(find build -name index.html -print -quit)
          if [ -z "$INDEX" ]; then
            echo "::error::No index.html found under build/ — the Unity build did not produce a Web player."
            exit 1
          fi
          SRC=$(dirname "$INDEX")
          echo "--- using $SRC ---"
          mkdir -p web/game
          cp -R "$SRC"/. web/game/
          ls -la web/game
          du -sh web/game

      - name: Upload web build
        uses: actions/upload-artifact@v4
        with:
          name: web-build
          path: web/game
          retention-days: 7

  image:
    name: Build or re-label game image
    runs-on: ubuntu-latest
    needs: [changes, build-web]
    if: ${{ !cancelled() && !failure() }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Get the web build
        if: needs.changes.outputs.game == 'true'
        uses: actions/download-artifact@v4
        with:
          name: web-build
          path: web/game

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push
        if: needs.changes.outputs.game == 'true'
        env:
          SEED: ${{ needs.changes.outputs.game_seed }}
        run: |
          IMAGE=ghcr.io/elisag94/bird-platformer:$SHA
          docker build -f docker/Dockerfile \
            --build-arg APP_VERSION="$SHA" \
            -t "$IMAGE" .
          docker push "$IMAGE"
          if [ -n "$SEED" ]; then
            docker tag "$IMAGE" "ghcr.io/elisag94/bird-platformer:$SEED"
            docker push "ghcr.io/elisag94/bird-platformer:$SEED"
          fi

      - name: Re-label existing image
        if: needs.changes.outputs.game != 'true'
        env:
          SRC: ${{ needs.changes.outputs.game_src }}
        run: |
          docker buildx imagetools create \
            --tag "ghcr.io/elisag94/bird-platformer:$SHA" \
                  "ghcr.io/elisag94/bird-platformer:$SRC"

  leaderboard-image:
    name: Build or re-label leaderboard image
    needs: changes
    runs-on: ubuntu-latest
    # needs only `changes` (seconds) — doesn't wait for Unity, so it runs in parallel
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push
        if: needs.changes.outputs.leaderboard == 'true'
        env:
          SEED: ${{ needs.changes.outputs.lb_seed }}
        run: |
          IMAGE=ghcr.io/elisag94/bird-leaderboard:$SHA
          docker build -t "$IMAGE" api/
          docker push "$IMAGE"
          if [ -n "$SEED" ]; then
            docker tag "$IMAGE" "ghcr.io/elisag94/bird-leaderboard:$SEED"
            docker push "ghcr.io/elisag94/bird-leaderboard:$SEED"
          fi

      - name: Re-label existing image
        if: needs.changes.outputs.leaderboard != 'true'
        env:
          SRC: ${{ needs.changes.outputs.lb_src }}
        run: |
          docker buildx imagetools create \
            --tag "ghcr.io/elisag94/bird-leaderboard:$SHA" \
                  "ghcr.io/elisag94/bird-leaderboard:$SRC"

  deploy-dev:
    name: Deploy dev
    runs-on: ubuntu-latest
    if: ${{ !cancelled() && !failure() }}
    needs: [image, leaderboard-image]
    environment: dev
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4

      # TEMP - CI proves the chart renders with this exact image for now, then prints the command.
      # Week 5's EKS cluster is where this becomes a real `helm upgrade`.
      - name: Render chart for dev
        run: |
          helm template bird-dev ./helm/bird-platformer \
            --set image.repository=ghcr.io/elisag94/bird-platformer \
            --set image.tag="$SHA" \
            --set leaderboard.image.repository=ghcr.io/elisag94/bird-leaderboard \
            --set leaderboard.image.tag="$SHA" > /dev/null
          {
            echo "### Deploy dev"
            echo '```'
            echo "helm upgrade --install bird-dev ./helm/bird-platformer -n bird-dev \\"
            echo "  --set image.repository=ghcr.io/elisag94/bird-platformer --set image.tag=$SHA --set leaderboard.image.repository=ghcr.io/elisag94/bird-leaderboard --set leaderboard.image.tag=$SHA"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  deploy-uat:
    name: Deploy uat
    runs-on: ubuntu-latest
    needs: [image, leaderboard-image]
    if: ${{ !cancelled() && !failure() && github.ref == 'refs/heads/main' }}
    environment: uat
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4

      # Same chart, same image tag as dev. Only release, namespace and values file differ.
      - name: Render chart for uat
        run: |
          helm template bird-uat ./helm/bird-platformer \
            -f ./helm/bird-platformer/values-uat.yaml \
            --set image.repository=ghcr.io/elisag94/bird-platformer \
            --set image.tag="$SHA" \
            --set leaderboard.image.repository=ghcr.io/elisag94/bird-leaderboard \
            --set leaderboard.image.tag="$SHA" > /dev/null
          {
            echo "### Deploy uat"
            echo '```'
            echo "helm upgrade --install bird-uat ./helm/bird-platformer -n bird-uat \\"
            echo "  -f ./helm/bird-platformer/values-uat.yaml \\"
            echo "  --set image.repository=ghcr.io/elisag94/bird-platformer --set image.tag=$SHA --set leaderboard.image.repository=ghcr.io/elisag94/bird-leaderboard --set leaderboard.image.tag=$SHA"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  deploy-prod:
    name: Deploy prod
    runs-on: ubuntu-latest
    needs: deploy-uat
    if: ${{ !cancelled() && !failure() && github.ref == 'refs/heads/main' }}
    environment: prod
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4

      # Same chart, same image tag as dev. Only release, namespace and values file differ.
      - name: Render chart for prod
        run: |
          helm template bird-prod ./helm/bird-platformer \
            -f ./helm/bird-platformer/values-prod.yaml \
            --set image.repository=ghcr.io/elisag94/bird-platformer \
            --set image.tag="$SHA" \
            --set leaderboard.image.repository=ghcr.io/elisag94/bird-leaderboard \
            --set leaderboard.image.tag="$SHA" > /dev/null
          {
            echo "### Deploy prod"
            echo '```'
            echo "helm upgrade --install bird-prod ./helm/bird-platformer -n bird-prod \\"
            echo "  -f ./helm/bird-platformer/values-prod.yaml \\"
            echo "  --set image.repository=ghcr.io/elisag94/bird-platformer --set image.tag=$SHA --set leaderboard.image.repository=ghcr.io/elisag94/bird-leaderboard --set leaderboard.image.tag=$SHA"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
