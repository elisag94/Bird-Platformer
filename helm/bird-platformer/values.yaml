# Defaults = dev-safe. A mistake here should fail small.
environment: dev

# Dev's quota has no room for a surge pod, so dev stops the old pod before
# starting the new one (brief downtime). UAT/prod start the new one first.
strategy:
  type: RollingUpdate
  rollingUpdate: { maxSurge: 0, maxUnavailable: 1 }

image:
  repository: bird-platformer
  tag: v4
  pullPolicy: IfNotPresent

replicaCount: 1

resources:
  requests: { memory: 32Mi, cpu: 50m }
  limits:   { memory: 128Mi, cpu: 200m }

hpa:
  enabled: false
  minReplicas: 2
  maxReplicas: 10
  targetCPUUtilizationPercentage: 50

ingress:
  host: dev.bird.local

leaderboard:
  image: bird-leaderboard:v2
  logLevel: DEBUG
  replicaCount: 1

postgres:
  storageSize: 1Gi